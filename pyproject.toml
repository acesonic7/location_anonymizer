[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "location-anonymizer"
version = "0.2.0"
description = "Removes data around home and other protected places in JSON location exports and generalises the rest"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
location-anonymizer = "location_anonymizer:main"

[tool.setuptools]
py-modules = ["location_anonymizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
